name: Print Student Info
on: [push]
jobs:
  print-info:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Execute scripts
        run: |
          python name.py
          python run_script.py
